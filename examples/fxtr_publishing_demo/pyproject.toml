[project]
name = "fxtr_publishing_demo"
version = "0.0.1"
description = "Publishing demo: build a provenanced report graph with nix and serve it over the stateless HTTP stack."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "fxtr2",
    "fxtr_nix_runner",
    "demo_types",
]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }
fxtr_nix_runner = { path = "../../projects/fxtr_nix_runner", editable = true }
# The demo's entity types (also a path-member of the workdir template's builder
# venv); seed_data.py imports it to construct + verify the seeded notes.
demo_types = { path = "publishing_workdir/packages/demo_types", editable = true }
# E2E-only: the report types the test reads back (RootReport / SubReport).
fxtr_report_builder = { path = "../../projects/fxtr_report_builder", editable = true }

[dependency-groups]
# httpx + the report types are E2E-only (the test reads the served report back and
# asserts its RootReport/SubReport shape).
dev = ["pytest", "httpx", "fxtr_report_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Script-only package — no packaged wheel; `uv run` resolves the deps and the
# scaffold / seed scripts are invoked directly.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
