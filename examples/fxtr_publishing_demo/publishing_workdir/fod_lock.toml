format_version = 1

# Empty to start: `fxtr_nix update-hashes` fills it during scaffold (one entry per
# `fxtr.preloads.note_<k>` slot). Committed (tracked) so the tool modifies it in
# place — nix's git flake fetcher only sees tracked files, and a host-side
# `git add` of a new file isn't readable by the podman builder's in-container
# libgit2.
[hashes]
