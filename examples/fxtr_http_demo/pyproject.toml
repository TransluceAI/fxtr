[project]
name = "fxtr_http_demo"
version = "0.0.1"
description = "Stateless HTTP-backend demo for the @fxtr-ui/connector-http + panel-viewer stack (fxtr 7a Part 5)"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "hypercorn",
    "starlette",
    "fxtr2",
    "fxtr_workstation",
]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }
fxtr_workstation = { path = "../../projects/fxtr_workstation", editable = true }

# Script-only package — no packaged wheel. `uv run` resolves the deps and
# `server/demo_backend.py` is invoked directly (by the web/ orchestrator).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
