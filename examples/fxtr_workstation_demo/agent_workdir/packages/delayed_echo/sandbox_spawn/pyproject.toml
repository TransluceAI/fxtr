# Sandbox-spawn environment for the delayed_echo service — a *virtual* uv
# project (`package = false`): not a code package, just the venv
# declaration the flake's `mkWasmService` builds the guest site-packages
# from. It depends on the host-importable `delayed-echo` package one level
# up (which lands the `delayed_echo` module in the guest) plus the sandbox
# RPC adapter, and constrains the resolver to WASI/wasm32 (the eryx
# runtime target) so only pure-python wheels are selected. The
# `fxtr.service` entry point is declared HERE — `mkWasmService` reads it
# from this file via `fromTOML`, no installed-dist metadata involved.
#
# This split keeps the parent package importable from a full-fxtr2 host
# venv (it has no wasm-pinned deps of its own) while this file owns
# everything execution-environment-specific. Services that don't need
# host importability can keep the single-pyproject form instead (see
# `packages/haiku_service_wasm/`).
#
# `[tool.uv.sources]` uses the comment-flip convention (see
# projects/fxtr_workstation/plans/phase0/part5_nix_workdir/stage3_bundle_and_spawner.md
# "Test & scaffold workdir setup"): relative paths are the active form,
# `prepare_workdir_repo` comments them out and activates the pinned git
# source in the workdir copy (which is what builds — it gives uv2nix the
# whole-repo context fxtr2-portable's force-include needs). No uv.lock is
# committed; the harness/scaffold generates it in the workdir from the
# git-source form. The `delayed-echo` path source carries no markers —
# it's an intra-workdir path, correct in both forms.
[project]
name = "delayed-echo-sandbox"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "delayed-echo",
    "fxtr-sandbox-rpc-adapter[fxtr2-portable]",
]

[project.entry-points."fxtr.service"]
service = "delayed_echo:run"

[tool.uv]
# Virtual root — install the deps (incl. the parent package), don't build
# this dir itself.
package = false
# Constrain the resolver to WASI/wasm32 (the eryx runtime target) so only
# pure-python wheels are selected. Same rationale as nix/sandbox_smoke.
environments = ["sys_platform == 'wasi' and platform_machine == 'wasm32'"]
required-environments = ["sys_platform == 'wasi' and platform_machine == 'wasm32'"]

[tool.uv.sources]
delayed-echo = { path = "..", editable = true }
fxtr-sandbox-rpc-adapter = { path = "../../../../../../projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-rpc-adapter = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter" } # fxtr-lib-sub: active-in-workdir
fxtr-sandbox-types = { path = "../../../../../../projects/fxtr_sandboxing/fxtr_sandbox_types", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-types = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_types" } # fxtr-lib-sub: active-in-workdir
fxtr2-portable = { path = "../../../../../../v2/portable", editable = true } # fxtr-lib-sub: active-in-template
# fxtr2-portable = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "v2/portable" } # fxtr-lib-sub: active-in-workdir
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

[tool.uv.extra-build-dependencies]
cbrrr = ["setuptools"]
sqlitedict = ["setuptools"]
mashumaro = ["setuptools"]
fxtr-sandbox-rpc-adapter = ["hatchling"]
fxtr-sandbox-types = ["hatchling"]
fxtr2-portable = ["hatchling"]
