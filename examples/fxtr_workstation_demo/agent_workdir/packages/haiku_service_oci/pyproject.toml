# Sandboxed Claude Haiku chat service (container/OCI flavor) — the container
# half of the demo's "talk to the network from a sandboxed service" pair (its
# sibling is packages/haiku_service_wasm/, the python-only wasm flavor).
# Built as `fxtr.services.haiku_service_oci` by the agent_workdir flake (via
# mkContainerService → a nix2container image) and spawned through the git-ref
# path (NixContainerServiceDefn).
#
# Unlike the wasm flavor this runs real Linux CPython, so the actual
# `anthropic` SDK is a normal dependency (its native Rust extensions — jiter,
# pydantic-core — ship as manylinux wheels). It uses the FULL fxtr2 flavor and
# redeclares fxtr v1 + full fxtr2 as sources (uv only honors the workspace
# root's [tool.uv.sources]; same convention as the container_greeter /
# container_transporter templates). No wasi `[tool.uv] environments`
# restriction (linux lock).
#
# `[tool.uv.sources]` uses the comment-flip convention ("Test & scaffold
# workdir setup" in projects/fxtr_workstation/plans/phase0/part5_nix_workdir/
# stage3_bundle_and_spawner.md): relative paths active in the template,
# pinned git sources activated in the workdir copy. No uv.lock is committed;
# the harness/scaffold generates it from the git-source form.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "haiku-service-oci"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fxtr",
    "fxtr2",
    "fxtr-sandbox-types[fxtr2]",
    "fxtr-sandbox-rpc-adapter[fxtr2,http]",
    "fxtr-service-runner",
]

[project.entry-points."fxtr.service"]
service = "haiku_service_oci:run"

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../../../../projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-rpc-adapter = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter" } # fxtr-lib-sub: active-in-workdir
fxtr-sandbox-types = { path = "../../../../../projects/fxtr_sandboxing/fxtr_sandbox_types", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-types = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_types" } # fxtr-lib-sub: active-in-workdir
fxtr-service-runner = { path = "../../../../../projects/fxtr_sandboxing/fxtr_service_runner", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-service-runner = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_service_runner" } # fxtr-lib-sub: active-in-workdir
fxtr2 = { path = "../../../../../v2", editable = true } # fxtr-lib-sub: active-in-template
# fxtr2 = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "v2" } # fxtr-lib-sub: active-in-workdir
fxtr = { path = "../../../../../projects/fxtr_v1", editable = true } # fxtr-lib-sub: active-in-template
# fxtr = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_v1" } # fxtr-lib-sub: active-in-workdir
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

# Build-dep hints for sdists uv2nix builds in the nix sandbox (sdists that
# under-declare their build backend). Mirrors nix/fxtr_nix_writer.
[tool.uv.extra-build-dependencies]
cbrrr = ["setuptools"]
sqlitedict = ["setuptools"]
mashumaro = ["setuptools"]
fxtr = ["hatchling"]
fxtr2 = ["hatchling"]
fxtr-sandbox-rpc-adapter = ["hatchling"]
fxtr-sandbox-types = ["hatchling"]
fxtr-service-runner = ["hatchling"]
