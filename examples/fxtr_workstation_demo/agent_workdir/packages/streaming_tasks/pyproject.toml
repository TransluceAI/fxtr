# Marks ``streaming_tasks`` as a Python package in the agent's
# ``packages/`` layout (see packages/README.md for the three venv
# contexts). Marker-style: NO dependencies — fxtr2 AND the
# ``simple_tasks`` marker (whose ``SimpleRunResult`` is the streaming
# run channel's final-value type) are supplied by the embedding venv
# (the type_entities aggregator; the runtime closure in the
# run_script sandbox; the wasm spawn envs that depend on both markers
# by path).
#
# Contents: the StreamingTask / StreamingScheduler protocols, their
# pinned type ids, and the two channel tag types (StreamingRunTag /
# TaskProgressTag) for the nested-channel demo (stage 13 part 4).
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "streaming-tasks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []
