# Marks ``report_builder`` as a Python package in the agent's
# ``packages/`` layout so the workstation MCP's sandbox bridge
# adds ``src/`` to ``sys.path`` automatically.
#
# Exposes the agent's typed view of the demo's report-builder
# service (well-known external name ``"report-builder"``) plus
# convenience helpers that hide the lookup + schedule_invoke dance.
[project]
name = "report_builder"
version = "0.0.0"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
