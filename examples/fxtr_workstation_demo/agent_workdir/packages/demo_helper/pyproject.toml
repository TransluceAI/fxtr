# Host-side helper service for the self-contained demo auto-driver — the
# HOST-IMPORTABLE marker package (like the host half of `delayed_echo/` /
# `presentables/`): marker-style, no dependencies (fxtr2 is supplied by whichever
# venv embeds it — the `type_entities/` aggregator on the host, so the flake can
# build the helper SERVICE type's typeEntity for `renderers/demo_helper/`).
#
# Unlike `delayed_echo`, there is NO `sandbox_spawn/` half: `WorkstationDemoHelper`
# is a HOST service (mounted by `run_demo_workstation.py` like `report-builder`),
# never spawned into a sandbox. This package only carries the wire-stable type id +
# the service protocol; the impl lives in `examples/.../demo_helper_service.py`.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "demo-helper"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []
