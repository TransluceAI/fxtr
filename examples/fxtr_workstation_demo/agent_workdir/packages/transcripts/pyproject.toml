# Exposes the ``Transcript`` entity type (and its
# ``TranscriptMessage`` value-type) — used to wrap a single Docent
# transcript so it can be ``present_to_user``'d and rendered with
# the matching ``renderers/transcript/`` TSX module.
[project]
name = "transcripts"
version = "0.0.0"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
