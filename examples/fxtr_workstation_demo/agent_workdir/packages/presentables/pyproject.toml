# Marks ``presentables`` as a Python package in the agent's
# ``packages/`` layout so the workstation MCP's sandbox bridge
# adds ``src/`` to ``sys.path`` automatically.
#
# Pure data — no service-side code, no external deps. The agent's
# sandboxed scripts construct instances and pass them to
# ``present_to_user(...)`` so they show up in the frontend's
# stream view (as part of the script-execution card's
# "Presented to user" emphasized block).
[project]
name = "presentables"
version = "0.0.0"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
