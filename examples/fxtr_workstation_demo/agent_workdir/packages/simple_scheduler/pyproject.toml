# SimpleTaskSequenceScheduler impl — the HOST-IMPORTABLE half of the
# package (split shape, like `delayed_echo/`; see packages/README.md).
# Marker-style: NO dependencies — fxtr2 is supplied by whichever venv
# embeds it (the demo's host venv for the impl tests in
# examples/fxtr_workstation_demo/tests/; the runtime closure in the
# run_script sandbox; fxtr2-portable in the wasm spawn env).
#
# The wasm spawn environment lives in `sandbox_spawn/pyproject.toml` — a
# uv project/venv *declaration* (not a code package) that depends on this
# one, pins the WASI resolution, and declares the `fxtr.service` entry
# point the spawner reads. The flake builds `fxtr.services.simple_scheduler`
# from `./sandbox_spawn`. Connect config is ignored (pass None); the
# returned service implements simple_tasks.SimpleTaskSequenceSchedulerProto.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "simple-scheduler"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []
