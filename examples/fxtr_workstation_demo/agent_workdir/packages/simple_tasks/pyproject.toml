# Marks ``simple_tasks`` as a Python package in the agent's
# ``packages/`` layout (see packages/README.md for the three venv
# contexts). Marker-style: NO dependencies — fxtr2 is supplied by the
# embedding venv (full fxtr2 in the type_entities aggregator so the
# flake can build the scheduler's typeEntity; the runtime closure in
# the run_script sandbox; fxtr2-portable in the wasm spawn envs that
# depend on this package by path).
#
# Contents: the SimpleTask / SimpleTaskSequenceScheduler protocols,
# their pinned type ids, the SimpleRunResult result entity, and the
# small demo entity types the basic tasks produce.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "simple-tasks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []
