# Marks ``docent_fxtr_proxy`` as a Python package in the agent's
# ``packages/`` layout so the workstation MCP's sandbox bridge
# adds ``src/`` to ``sys.path`` automatically.
#
# Exposes the agent's typed view of the demo's docent-proxy service
# (well-known external name ``"docent-fxtr-proxy"``) plus the entity
# dataclasses each method returns and convenience helpers that hide
# the lookup + schedule_invoke dance. The host imports the entity
# types from this package via ``sys.path.insert`` (same trick
# ``run_demo_workstation.py`` uses for ``presentables``) so a single
# source of truth defines the wire types.
[project]
name = "docent_fxtr_proxy"
version = "0.0.0"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
