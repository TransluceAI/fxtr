# Aggregator workspace for the type entities the experiment demo's UI preset
# routes (the ExpNote entity type + the experiment-demo-helper service type +
# the behavior scenario's entity types and its driver service type; the
# fxtr_experiment types come from the repo lib's stub venv, not from here).
# A *virtual* project (no [build-system], no src/): its sole job is to be the
# single `mkVenv` root that makes `experiment_notes` /
# `experiment_demo_helper` importable so `mkEntityFromPython` can pin each
# type's FxtrID into a typeEntity layer (the dispatcher's eager set_preset
# validation builds + checks those against the preset key). Same shape as
# examples/fxtr_workstation_demo/agent_workdir/type_entities/.
#
# Comment-flip convention: the relative fxtr2/fxtr sources are active in the
# template; `prepare_workdir_repo` comments them out and activates the pinned
# git source in the workdir copy (which is what the preset's git-ref build
# uses). No uv.lock is committed; the scaffold/harness generates it. The
# intra-workdir package paths + the mashumaro git dep carry no markers —
# they're correct in both forms.
[project]
name = "fxtr-experiment-demo-type-entities"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fxtr2",
    "experiment_notes",
    "experiment_demo_helper",
    "behavior_research_types",
    "behavior_demo_helper",
]

[tool.uv]
# Virtual root — coordinate + install the members, don't build this dir itself.
package = false

[tool.uv.sources]
experiment_notes = { path = "../packages/experiment_notes", editable = true }
experiment_demo_helper = { path = "../packages/experiment_demo_helper", editable = true }
behavior_research_types = { path = "../packages/behavior_research_types", editable = true }
behavior_demo_helper = { path = "../packages/behavior_demo_helper", editable = true }
fxtr2 = { path = "../../../../v2", editable = true } # fxtr-lib-sub: active-in-template
# fxtr2 = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "v2" } # fxtr-lib-sub: active-in-workdir
fxtr = { path = "../../../../projects/fxtr_v1", editable = true } # fxtr-lib-sub: active-in-template
# fxtr = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_v1" } # fxtr-lib-sub: active-in-workdir
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

[tool.uv.extra-build-dependencies]
cbrrr = ["setuptools"]
sqlitedict = ["setuptools"]
mashumaro = ["setuptools"]
fxtr = ["hatchling"]
fxtr2 = ["hatchling"]
