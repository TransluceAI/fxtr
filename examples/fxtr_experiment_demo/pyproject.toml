[project]
name = "fxtr_experiment_demo"
version = "0.0.1"
description = "Persistent experiment-backend demo: a fxtr_experiment workflow runner hosted in a workstation"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "anthropic>=0.40",
    "fxtr2",
    "fxtr_experiment",
    "fxtr_workstation[client]",
    "fxtr_sandboxing",
]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }
fxtr_experiment = { path = "../../projects/fxtr_experiment", editable = true }
# The task-side dist arrives as a transitive path dep of fxtr_experiment;
# uv honors only the root project's sources, so it needs its own entry here.
fxtr-experiment-task = { path = "../../projects/fxtr_experiment/task_package", editable = true }
fxtr_workstation = { path = "../../projects/fxtr_workstation", editable = true }
fxtr_sandboxing = { path = "../../projects/fxtr_sandboxing/fxtr_sandboxing", editable = true }

# Host-side tests for the demo task fns + the runner mount (the workdir
# packages are made importable by tests/conftest.py sys.path inserts,
# mirroring run_experiment_demo.py).
[dependency-groups]
dev = ["pytest", "pytest-xdist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# This is a script-only package — no packaged wheel, no installable
# modules. ``uv run`` resolves the deps; the ``run_experiment_demo.py``
# script is invoked directly.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
