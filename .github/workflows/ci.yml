# Checks every pull request and every push to main: the pre-commit hooks, the Python test suite
# against Postgres (with uv.lock, and with every direct dependency at its lowest allowed version),
# behaviors' tests against its lowest allowed fxtr, the TypeScript workspace's typecheck and tests,
# the example projects' renderers, and the distribution build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  # `locked` installs uv.lock. `lowest-direct` relocks with every direct dependency at the lowest
  # version its range allows, so a lower bound too old for the code fails here. The flags go on the
  # sync, not in the environment, since the tests run uv on projects of their own.
  python-tests:
    name: python-tests (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: locked
            sync: --frozen
          - resolution: lowest-direct
            sync: --resolution lowest-direct
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fxtr
          POSTGRES_PASSWORD: fxtr
          POSTGRES_DB: fxtr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fxtr -d fxtr"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service has no TLS. Without ssl=disable, asyncpg first asks the server for TLS, and a
      # connection cancelled while it waits for the reply (as cancellation tests do) raises
      # InvalidStateError in the event loop, which fails the test.
      FXTR_TEST_DATABASE_URL: postgresql+asyncpg://fxtr:fxtr@localhost:5432/fxtr?ssl=disable
      # Opts in to the tests that launch a job of a copied example project and of a new one.
      FXTR_TEST_EXAMPLE_PROJECT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The project-launch tests commit in throwaway repositories.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: uv sync ${{ matrix.sync }} --all-packages --all-extras
      # --no-sync keeps the environment just synced; a plain `uv run` would relock to the newest.
      - run: uv run --no-sync pytest -n auto

  # behaviors' tests against the lowest fxtr its range allows, installed from PyPI, with every other
  # dependency held to uv.lock so that fxtr is the only difference from python-tests. When the lower
  # bound is the workspace's fxtr, python-tests already covers it.
  behaviors-fxtr-lower-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: |
          release() { uv run --frozen python scripts/release_version.py "$@"; }
          lower=$(release version fxtr-lower-bound)
          if [ "$lower" = "$(release version fxtr)" ]; then
            echo "behaviors' lowest fxtr, $lower, is the workspace's; python-tests covers it."
            exit 0
          fi
          uv export --frozen --package behaviors --all-extras --no-emit-workspace --no-hashes \
            --no-header -o "$RUNNER_TEMP/constraints.txt"
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" --no-sources \
            -c "$RUNNER_TEMP/constraints.txt" "./behaviors[models,docent]" "fxtr==$lower" pytest
          cd behaviors && "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  example-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            example_projects/*/views/pnpm-lock.yaml
      # Shared libraries are linked as source; their own dependencies live in the core workspace.
      - run: pnpm install --frozen-lockfile
      - name: Check example renderers
        run: |
          for views in example_projects/*/views; do
            echo "::group::$views"
            pnpm --dir "$views" install --frozen-lockfile
            pnpm --dir "$views" typecheck
            pnpm --dir "$views" test
            echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # Builds the viewer, then fxtr's sdist and wheel (which carry it and the renderer packages).
      - run: pnpm build:dist
      - run: uv build --package behaviors
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
