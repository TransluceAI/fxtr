[project]
name = "clydra"
version = "0.1.0"
description = "A thingwatcher-based frontend for Claude Code via the Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.0",
    "cbor2>=5.0",
    "claude-agent-sdk>=0.1.0",
    "thingwatcher",
]

[tool.uv.sources]
thingwatcher = { path = "../thingwatcher", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clydra"]

[project.scripts]
clydra = "clydra.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
