
# RootID: Simple string identifier for a root entry point (e.g. "dict", "simple")
scalar RootID

# StreamID: Simple string identifier for a stream
scalar StreamID

# NodeID: JSON-encoded [["root"|"stream", id], ...path] for navigable content
# The first element identifies the container type and ID
# For roots: [["root", rootId], ...path]
# For streams: [["stream", streamId], itemIndex, ...path] (itemIndex is first path segment)
# IMPORTANT: Compact JSON with NO spaces (use separators=(",",":") in Python)
# Examples:
#   [["root","dict"]]                 - root content
#   [["root","dict"],"beta",0]        - path within root
#   [["stream","mystream"],0]         - first stream item
#   [["stream","mystream"],2,"key"]   - path within third stream item
scalar NodeID

# JSONPath: JSON-encoded path array for explicit navigation
# Elements are strings (dict keys) or ints (list indices)
# IMPORTANT: Compact JSON with NO spaces (use separators=(",",":") in Python)
# Examples: [], ["beta"], ["beta",0]
scalar JSONPath

type Foo {
    id: ID!
    data: String!
}

# FooNode: The cacheable wrapper with an ID
# This is what gets cached - the ID uniquely identifies a position in the tree
type FooNode {
    id: NodeID!
    data: FooData!
}

# FooData: Union of the actual data shapes (no ID on these)
# Note: FooStreamRef can only appear within stream content, not root content (enforced at data layer)
union FooData = FooSingle | FooList | FooDict | FooRef | FooStreamRef

type FooSingle {
    value: Foo!
}

type FooList {
    items: [FooNode!]!
}

type FooEntry {
    key: String!
    value: FooNode!
}

type FooDict {
    entries: [FooEntry!]!
}

# FooRef: A reference to another root
type FooRef {
    targetId: RootID!
    load: Root
}

# FooStreamRef: A reference to a stream (only allowed within stream content)
type FooStreamRef {
    targetId: StreamID!
    load: Stream
}

# Root is an entry point with simple string ID
type Root {
    id: RootID!
    content: FooNode!
}

# Stream: A temporal sequence of FooNodes
# - key: optional reference to a root that identifies/describes this stream
# - items: list of emitted nodes (null after finalization)
# - finalResult: optional reference to the final result root (set when finalized)
type Stream {
    id: StreamID!
    key: FooRef
    items: [FooNode!]
    itemCount: Int
    finalResult: FooRef
    isFinalized: Boolean!
}

# Registry wraps visible roots and streams with a generation tag for cache-safe updates
type Registry {
    generation: Int!
    roots: [Root!]!
    streams: [Stream!]!
}

type Query {
    # Registry with generation-based caching
    registry: Registry!

    # Direct lookups (for refs and direct access)
    root(id: RootID!): Root
    stream(id: StreamID!): Stream

    # Node lookup - returns content within a root or stream
    node(id: NodeID!): FooNode
    # Explicit root ID and path (path [] means the root's content)
    nodeByPath(rootId: RootID!, path: JSONPath!): FooNode
}

# Stream update events for subscriptions
type StreamItemEmitted {
    streamId: StreamID!
    index: Int!
    node: FooNode!
}

type StreamFinalized {
    streamId: StreamID!
    finalResultTargetId: RootID!
}

union StreamUpdateEvent = StreamItemEmitted | StreamFinalized

# Registry update events for subscriptions
type RootAdded {
    generation: Int!
    root: Root!
}

type RootRemoved {
    generation: Int!
    rootId: RootID!
}

type StreamAdded {
    generation: Int!
    stream: Stream!
}

type StreamRemoved {
    generation: Int!
    streamId: StreamID!
}

union RegistryUpdateEvent = RootAdded | RootRemoved | StreamAdded | StreamRemoved

type Subscription {
    # Subscribe to registry updates starting after the given generation
    # Use afterGeneration: 0 to start from current state (no catch-up)
    # Use afterGeneration: -1 to get all events from the beginning
    registryUpdates(afterGeneration: Int!): RegistryUpdateEvent!

    # Subscribe to stream updates starting after the given index
    # Use afterIndex: -1 to get all items from the beginning
    streamUpdates(id: StreamID!, afterIndex: Int!): StreamUpdateEvent!
}
