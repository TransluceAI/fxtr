exclude: "^external/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
        exclude: "website/public/.*|package-lock.json|pnpm-lock.yaml|poetry\\.lock|uv.lock"
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --group dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --group dev ruff format
        language: system
        types_or: [python, pyi]
      - id: uv-lock
        name: uv-lock
        description: "Check that the product-package workspace lockfile is current"
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|[^/]+/pyproject\.toml|uv\.lock)$
        pass_filenames: false
        minimum_pre_commit_version: "2.9.2"
      - id: license-copies
        name: license copies
        description: "Check that every copy of the LICENSE and NOTICE matches fxtr's: behaviors', and the repository root's where there is one (an sdist cannot carry a symlink out of its package)"
        entry: bash -c 'for f in LICENSE NOTICE; do for copy in behaviors/$f $f; do if [ -e "$copy" ]; then cmp fxtr/$f "$copy" || exit 1; fi; done; done'
        language: system
        files: ^((fxtr|behaviors)/)?(LICENSE|NOTICE)$
        pass_filenames: false
      - id: release-versions
        name: release versions
        description: "Check fxtr's and behaviors' versions and behaviors' range of fxtr versions"
        entry: uv run --frozen --group dev python scripts/release_version.py check
        language: system
        files: ^((fxtr|behaviors)/pyproject\.toml|scripts/release_version\.py)$
        pass_filenames: false
      - id: pyright-fxtr
        name: pyright (fxtr)
        entry: uv run --directory fxtr --frozen --group dev --all-extras pyright
        language: system
        files: ^(fxtr/.*\.py|fxtr/pyproject\.toml|pyright-base\.json)$
        pass_filenames: false
      - id: uv-lock-basic-project
        name: uv-lock (example_projects/basic_project)
        description: "Check that the example project's lockfile is current (it depends on fxtr by path)"
        entry: uv lock --check --project example_projects/basic_project
        language: system
        files: ^(fxtr/pyproject\.toml|example_projects/basic_project/(pyproject\.toml|uv\.lock))$
        pass_filenames: false
      - id: pyright-basic-project
        name: pyright (example_projects/basic_project)
        entry: uv run --directory example_projects/basic_project --frozen --group dev pyright
        language: system
        files: ^(example_projects/basic_project/.*\.py|example_projects/basic_project/pyproject\.toml|pyright-base\.json)$
        pass_filenames: false
      - id: pyright-behaviors
        name: pyright (behaviors)
        entry: uv run --directory behaviors --frozen --group dev --all-extras pyright
        language: system
        files: ^(behaviors/.*\.py|behaviors/pyproject\.toml|fxtr/src/.*\.py|pyright-base\.json)$
        pass_filenames: false
      - id: uv-lock-behavior-rollouts
        name: uv-lock (example_projects/behavior_rollouts)
        entry: uv lock --check --project example_projects/behavior_rollouts
        language: system
        files: ^((fxtr|behaviors)/pyproject\.toml|example_projects/behavior_rollouts/(pyproject\.toml|uv\.lock))$
        pass_filenames: false
      - id: pyright-behavior-rollouts
        name: pyright (example_projects/behavior_rollouts)
        entry: uv run --directory example_projects/behavior_rollouts --frozen --group dev pyright
        language: system
        files: ^(example_projects/behavior_rollouts/.*\.py|example_projects/behavior_rollouts/pyproject\.toml|example_projects/example_project_testing\.py|pyright-base\.json)$
        pass_filenames: false
