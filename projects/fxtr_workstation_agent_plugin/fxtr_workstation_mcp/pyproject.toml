[project]
name = "fxtr_workstation_mcp"
version = "0.0.1"
description = "MCP server bridging an agent to a fxtr_workstation session"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "fxtr2",
    "fxtr-nix-runner",
    "fxtr_workstation[client]",
    "fxtr_sandboxing",
    "fxtr-sandbox-types[fxtr2]",
    "fxtr_ws_mcp_sandbox_bridge[fxtr2]",
    "httpx-ws>=0.9.0",
    "mcp>=1.6.0",
    "msgspec>=0.21.0",
    "tomlkit>=0.13.0",
    "pyeryx",
]

[project.scripts]
fxtr-workstation-mcp = "fxtr_workstation_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxtr_workstation_mcp"]

[tool.uv.sources]
fxtr2 = { path = "../../../v2", editable = true }
fxtr-nix-runner = { path = "../../fxtr_nix_runner", editable = true }
fxtr_workstation = { path = "../../fxtr_workstation", editable = true }
fxtr_sandboxing = { path = "../../fxtr_sandboxing/fxtr_sandboxing", editable = true }
fxtr-sandbox-types = { path = "../../fxtr_sandboxing/fxtr_sandbox_types", editable = true }
fxtr_ws_mcp_sandbox_bridge = { path = "../sandbox/fxtr_ws_mcp_sandbox_bridge", editable = true }
fxtr-workdir-harness = { path = "../../../nix/fxtr_workdir_harness", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that pay the eryx factory bootstrap cost",
]

[tool.pyright]
include = [
    "src/fxtr_workstation_mcp",
]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=15.0",
    "pyright>=1.1.0",
    # Builds the throwaway agent workdir for the nix-spawn E2E test.
    "fxtr-workdir-harness",
]
