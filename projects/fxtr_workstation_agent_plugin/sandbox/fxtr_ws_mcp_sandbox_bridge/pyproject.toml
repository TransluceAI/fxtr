[project]
name = "fxtr_ws_mcp_sandbox_bridge"
version = "0.0.1"
description = "Sandbox-side bridge for fxtr_workstation_mcp; mounted as a volume in each sandbox and imported by the host."
requires-python = ">=3.12"
# This package is imported on both sides:
# - host: as a regular path-installed dep of ``fxtr_workstation_mcp``;
#   uses the ``fxtr2`` extra.
# - sandbox: mounted via volume; the WASM-image ``fxtr2-portable``
#   already satisfies the import-time deps so this isn't installed
#   into the sandbox env.
dependencies = []

[project.optional-dependencies]
fxtr2 = ["fxtr2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fxtr_ws_mcp_sandbox_bridge"]

[tool.uv.sources]
fxtr2 = { path = "../../../../v2", editable = true }
