[project]
name = "fxtr_experiment"
version = "0.0.1a0"
description = "Durable, grid-based workflow system on top of fxtr2"
requires-python = ">=3.12"
dependencies = [
    "fxtr2",
    # The task-side half of this project (task_package/): the view
    # calculus, view runtime, and task-fn adapter. A guest installs it
    # alone; the runner always wants the frame runtime, hence [frames]
    # (which is where polars enters — never a direct dep here).
    "fxtr-experiment-task[frames]",
    # The shared binding-connect request shape (BindingConnectRequest) —
    # the standard interface bound implementations receive; see
    # notes/sandboxed_bindings.md.
    "fxtr-sandbox-types[fxtr2]",
    # Sandboxed-binding *serving* (sandbox_launcher.py — the package's
    # sole fxtr_sandboxing importer): the host machinery (eryx, aiohttp,
    # podman drivers) a runner needs to launch sandboxes. A plain
    # dependency, because only runners install this distribution — a
    # sandbox guest installs fxtr-experiment-task. `open_local` still
    # imports the launcher lazily, so a runner with no configured repo
    # does not pay the import cost.
    "fxtr-sandboxing",
    "anyio>=4.12.1",
    "tomlkit>=0.12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fxtr_experiment"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-anyio>=0.0.0",
    "pytest-xdist>=3.6.0",
    "pyright>=1.1.0",
    # The workdir-fixture harness: the gated sandbox e2e suite builds
    # guest workdirs. (fxtr-sandboxing itself is a plain runtime
    # dependency above.)
    "fxtr-workdir-harness",
    # duckdb + pyarrow back the frame interop smoke test. Neither is a
    # runtime dep: the framework's frame handling is pure polars, and
    # polars-only task code needs neither. They are required only to query
    # a returned frame via duckdb (`duckdb.sql("from df")` → polars'
    # `to_arrow()` → pyarrow), which is an opt-in the task author installs.
    "duckdb>=1.5.4",
    "pyarrow>=25.0.0",
]

[tool.pyright]
include = [
    "fxtr_experiment",
    # The nested task-side dist (task_package/): installed editable into
    # this one venv, so the existing pre-commit pyright hook covers both
    # dists with no second hook and no second venv.
    "task_package/fxtr_experiment_task",
    "tests",
]
exclude = [
    # Sandbox-guest fixture workdirs: resolved against guest environments
    # (fxtr2-portable / the container image), not this venv.
    "tests/_workdir_templates",
]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }
fxtr-experiment-task = { path = "task_package", editable = true }
fxtr-sandbox-types = { path = "../fxtr_sandboxing/fxtr_sandbox_types", editable = true }
fxtr-sandboxing = { path = "../fxtr_sandboxing/fxtr_sandboxing", editable = true }
fxtr-workdir-harness = { path = "../../nix/fxtr_workdir_harness", editable = true }

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["fxtr2", "fxtr_experiment", "fxtr_experiment_task"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nix_runtime: needs a configured nix backend + sandbox runtime; skips when unconfigured (set FXTR_TESTS_REQUIRE_RUNTIME=1 to fail instead)",
]
