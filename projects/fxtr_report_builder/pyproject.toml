[project]
name = "fxtr_report_builder"
version = "0.1.0"
description = "Report entity types + MDX-to-FxtrCbor compiler for fxtr2"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "fxtr2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = [
    "src/fxtr_report_builder",
]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src/fxtr_report_builder"]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pyright>=1.1.0",
]
