# Test fixture: a host fxtr2 workdir venv backing a pure `mkFxtrFnBuilder` with
# provenanced = true (see this dir's flake.nix), plus a committed tsv namespace
# served alongside it. Built through prepare_workdir_repo (the git-ref path).
# Mirrors the provenanced_builder fixture.
#
# `[tool.uv.sources]` uses the comment-flip convention: relative paths active in
# the template, pinned git sources activated in the workdir copy. No uv.lock is
# committed; the harness generates it from the git-source form.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "publishing_demo"
version = "0.0.1"
description = "Provenanced builder entrypoint fixture for the fxtr_nix_runner publishing-serve E2E."
requires-python = ">=3.12"
dependencies = [
    "fxtr2",
]

[tool.uv.sources]
fxtr2 = { path = "../../../../../v2", editable = true } # fxtr-lib-sub: active-in-template
# fxtr2 = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "v2" } # fxtr-lib-sub: active-in-workdir
fxtr = { path = "../../../../../projects/fxtr_v1", editable = true } # fxtr-lib-sub: active-in-template
# fxtr = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_v1" } # fxtr-lib-sub: active-in-workdir
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

# Build-dep hints for sdists uv2nix builds in the nix sandbox (sdists that
# under-declare their build backend). Mirrors provenanced_builder.
[tool.uv.extra-build-dependencies]
cbrrr = ["setuptools"]
sqlitedict = ["setuptools"]
mashumaro = ["setuptools"]
fxtr = ["hatchling"]
fxtr2 = ["hatchling"]
