[project]
name = "baz"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bar @ https://fxtr.transluce.org/unreachable/bar-0.0.0.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
bar = { path = "../bar", editable = true }
