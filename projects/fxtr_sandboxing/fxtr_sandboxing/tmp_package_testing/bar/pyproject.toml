[project]
name = "bar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "foo @ https://fxtr.transluce.org/unreachable/foo-0.0.0.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
foo = { path = "../foo", editable = true }
