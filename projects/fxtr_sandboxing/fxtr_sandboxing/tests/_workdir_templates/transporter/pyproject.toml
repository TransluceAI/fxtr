# Test fixture: a wasm transporter-service workdir for the transport E2E
# tests over the NixWasmServiceDefn spawn path. Built through mkWasmService
# as `fxtr.services.transporter` via prepare_workdir_repo (the git-ref
# path). Ported from examples/transport_task; same shape as the sibling
# `greeter` fixture, plus the [http] extra so the task can use
# `fxtr_sandbox_rpc_adapter.get_client(authorizer_ref)` (httpx/httpcore are
# pure-python, so they survive the wasi-restricted lock).
#
# `[tool.uv.sources]` uses the comment-flip convention ("Test & scaffold
# workdir setup" in projects/fxtr_workstation/plans/phase0/part5_nix_workdir/
# stage3_bundle_and_spawner.md): relative paths active in the template,
# pinned git sources activated in the workdir copy. No uv.lock is
# committed; the harness generates it from the git-source form.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "transport_task"
version = "0.0.1"
description = "Transporter service fixture for the transport E2E tests over the git-ref wasm path."
requires-python = ">=3.12"
dependencies = [
    "fxtr-sandbox-rpc-adapter[fxtr2-portable,http]",
]

[project.entry-points."fxtr.service"]
service = "transport_task:run"

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../../../fxtr_sandbox_rpc_adapter", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-rpc-adapter = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter" } # fxtr-lib-sub: active-in-workdir
fxtr-sandbox-types = { path = "../../../../fxtr_sandbox_types", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-types = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_types" } # fxtr-lib-sub: active-in-workdir
fxtr2-portable = { path = "../../../../../../v2/portable", editable = true } # fxtr-lib-sub: active-in-template
# fxtr2-portable = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "v2/portable" } # fxtr-lib-sub: active-in-workdir
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

[tool.uv.extra-build-dependencies]
cbrrr = ["setuptools"]
sqlitedict = ["setuptools"]
mashumaro = ["setuptools"]
fxtr-sandbox-rpc-adapter = ["hatchling"]
fxtr-sandbox-types = ["hatchling"]
fxtr2-portable = ["hatchling"]

[tool.uv]
# Constrain the resolver to WASI/wasm32 (the eryx runtime target) so only
# pure-python wheels are selected. Same rationale as nix/sandbox_smoke.
environments = ["sys_platform == 'wasi' and platform_machine == 'wasm32'"]
required-environments = ["sys_platform == 'wasi' and platform_machine == 'wasm32'"]
