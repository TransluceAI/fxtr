# Test fixture: a pyodide greeter-service workdir for the
# NixPyodideServiceDefn spawn tests. Built through mkPyodideService as
# `fxtr.services.pyodide_greeter` via prepare_workdir_repo (the git-ref
# path). Mirrors the wasi greeter fixture, plus a binary PEP 783 dep
# (pydantic-core) to prove pyemscripten wheel selection end-to-end.
#
# `[tool.uv.sources]` uses the comment-flip convention (see the stage3 plan's
# "Test & scaffold workdir setup"): relative paths are the active form,
# prepare_workdir_repo comments them out and activates the pinned git source
# in the workdir copy (which is what builds — it gives the pythonSet the
# whole-repo context fxtr2-portable's force-include needs). No uv.lock is
# committed; the harness generates it in the tempdir from the git-source form.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "pyodide_rpc_task"
version = "0.0.1"
description = "Greeter service fixture for the NixPyodideServiceDefn spawn tests."
requires-python = ">=3.12"
dependencies = [
    "fxtr-sandbox-rpc-adapter[fxtr2-portable]",
    # The binary-wheel probe: ships a cp314 pyemscripten_2026_0_wasm32 wheel
    # on PyPI (PEP 783). validated_add imports it in-guest.
    "pydantic-core==2.47.0",
]

[project.entry-points."fxtr.service"]
service = "pyodide_rpc_task:run"

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../../../fxtr_sandbox_rpc_adapter", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-rpc-adapter = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter" } # fxtr-lib-sub: active-in-workdir
fxtr-sandbox-types = { path = "../../../../fxtr_sandbox_types", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-types = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_types" } # fxtr-lib-sub: active-in-workdir
fxtr2-portable = { path = "../../../../../../v2/portable", editable = true } # fxtr-lib-sub: active-in-template
# fxtr2-portable = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "v2/portable" } # fxtr-lib-sub: active-in-workdir
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

[tool.uv.extra-build-dependencies]
mashumaro = ["setuptools"]
fxtr-sandbox-rpc-adapter = ["hatchling"]
fxtr-sandbox-types = ["hatchling"]
fxtr2-portable = ["hatchling"]

[tool.uv]
# Constrain the resolver to emscripten/wasm32 (the pyodide runtime target).
# required-environments guarantees the lock carries a working resolution for
# the guest platform; environments keeps the lock small.
environments = ["sys_platform == 'emscripten' and platform_machine == 'wasm32'"]
required-environments = ["sys_platform == 'emscripten' and platform_machine == 'wasm32'"]
