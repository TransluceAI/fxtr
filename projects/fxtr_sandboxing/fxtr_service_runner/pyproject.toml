[project]
name = "fxtr-service-runner"
version = "0.1.0"
description = "In-container helper that runs fxtr services via fxtr_sandbox_rpc_adapter."
requires-python = ">=3.12"
# fxtr-sandbox-rpc-adapter is declared without an extra — the flavor
# (fxtr2 vs fxtr2-portable) is selected by the topmost consumer (e.g.
# the user task's pyproject.toml).
dependencies = [
    "anyio>=4",
    "httpx>=0.28",
    "fxtr-sandbox-rpc-adapter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxtr_service_runner"]

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../fxtr_sandbox_rpc_adapter", editable = true }
