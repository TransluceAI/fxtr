# fxtr-pyodide-runner — the host-trusted deno driver for the pyodide sandbox
# backend, plus the (flake-copied, guest-untrusted) pyodide bootstrap.
#
# Installed on the HOST (a dependency of fxtr_sandboxing); the driver files
# (main.ts, deno.json) ship as package data and are passed to `deno run` by
# path. guest_bootstrap.py is also package data, but is never imported on the
# host — the nix runtime bundle (`_mkPyodideRuntimeBundle.nix`) copies it from
# the flake's pinned fxtr rev, and the driver runs it inside pyodide.
[project]
name = "fxtr-pyodide-runner"
version = "0.1.0"
description = "Deno driver + guest bootstrap for the pyodide sandbox backend."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxtr_pyodide_runner"]
