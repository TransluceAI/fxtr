[project]
name = "rpc-task"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # The [fxtr2-portable] extra picks the pure-Python fxtr2 flavor that's
    # bundleable into the eryx WASM sandbox. The container-side demo
    # (examples/container_rpc_task/task_src) uses [fxtr2] instead.
    "fxtr-sandbox-rpc-adapter[fxtr2-portable] @ https://fxtr.transluce.org/unreachable/fxtr_sandbox_rpc_adapter-0.0.0.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../fxtr_sandbox_rpc_adapter" }

[project.entry-points."fxtr.service"]
service = "rpc_task:run"
