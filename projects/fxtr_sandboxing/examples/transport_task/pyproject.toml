[project]
name = "transport-task"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # The [fxtr2-portable] extra picks the pure-Python fxtr2 flavor that's
    # bundleable into the eryx WASM sandbox. The [http] extra adds httpx +
    # httpcore so this task can use ``get_client(authorizer_ref)`` to make
    # HTTP calls through the authorizer's transport.
    "fxtr-sandbox-rpc-adapter[fxtr2-portable,http] @ https://fxtr.transluce.org/unreachable/fxtr_sandbox_rpc_adapter-0.0.0.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../fxtr_sandbox_rpc_adapter" }

[project.entry-points."fxtr.service"]
service = "transport_task:run"
