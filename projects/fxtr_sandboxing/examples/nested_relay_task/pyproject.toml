[project]
name = "nested-relay-task"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # The [fxtr2-portable] extra picks the pure-Python fxtr2 flavor that's
    # bundleable into the eryx WASM sandbox. No [http] extra here — the
    # outer never makes HTTP calls itself; only the inner does. The outer
    # holds a ServiceRef[NetworkHandleAuthorizerProto] and passes it
    # through to the inner via the inner's own connect(config).
    "fxtr-sandbox-rpc-adapter[fxtr2-portable] @ https://fxtr.transluce.org/unreachable/fxtr_sandbox_rpc_adapter-0.0.0.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../fxtr_sandbox_rpc_adapter" }

[project.entry-points."fxtr.service"]
service = "nested_relay_task:run"
