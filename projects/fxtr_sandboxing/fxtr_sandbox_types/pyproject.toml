[project]
name = "fxtr-sandbox-types"
version = "0.0.0"
description = "Shared entity types and service protocols used by the host and sandbox sides of the fxtr isolation spike"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4",
]

# Pair this package with one of the two extras. Both pull in the same fxtr2 module
# names (so are mutually exclusive — declared in [tool.uv] conflicts below):
#
#   `fxtr-sandbox-types[fxtr2]`          for hosts and full Linux containers
#   `fxtr-sandbox-types[fxtr2-portable]` for the eryx WASM sandbox
[project.optional-dependencies]
fxtr2 = ["fxtr2"]
fxtr2-portable = ["fxtr2-portable"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# fxtr2 and fxtr2-portable provide overlapping module trees (both register
# `fxtr2/...`), so a single environment can have at most one of them.
# Declaring the extras as conflicting tells uv to resolve each in its own
# fork, preventing accidental cross-contamination during workspace lock.
conflicts = [
    [
        { extra = "fxtr2" },
        { extra = "fxtr2-portable" },
    ],
]

[tool.uv.sources]
fxtr2 = { path = "../../../v2", editable = true }
fxtr2-portable = { path = "../../../v2/portable" }

[tool.hatch.build.targets.wheel]
packages = ["src/fxtr_sandbox_types"]
