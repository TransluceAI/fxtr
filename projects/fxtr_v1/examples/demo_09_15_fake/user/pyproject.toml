
[project]
name = "demo_09_15_fake_user"
version = "0.0.1"
description = "Demo 09/15 user package."
requires-python = "==3.12.*,!=3.12.5"
dependencies = [
    "fxtr[ui]", "demo_09_15_fake_defns", "demo_09_15_fake",
]

[dependency-groups]
pyimpl = [
   "openai==1.108.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_09_15_fake_user"]

[tool.uv]
constraint-dependencies = ["picoview", "luce_lib"]


[tool.uv.sources]
demo_09_15_fake_defns = { path = "../lib/blueprint", editable = true }
demo_09_15_fake = { path = "../lib/pyimpl", editable = true }
fxtr = { path = "../../..", editable = true }
