
[project]
name = "demo_agentic_misalignment_user"
version = "0.0.1"
description = "Demo agentic misalignment user package."
requires-python = "==3.12.*,!=3.12.5"
dependencies = [
    "fxtr[ui]", "demo_agentic_misalignment_defns"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_agentic_misalignment_user"]

[tool.uv]
constraint-dependencies = ["picoview", "luce_lib"]

[tool.uv.sources]
demo_agentic_misalignment_defns = { path = "../lib/blueprint", editable = true }
fxtr = { path = "../../..", editable = true }
