[project]
name = "behavior-rollouts"
version = "0.1.0"
description = "Behavior rollouts experiments using behaviors and fxtr"
requires-python = ">=3.12.4"
dependencies = ["fxtr[runner,debug-web]", "behaviors[models]"]

[dependency-groups]
dev = ["pyright>=1.1.411", "pytest>=9.1.1", "pytest-xdist>=3.8.0"]

[tool.uv]
package = true

[tool.uv.sources]
fxtr = { path = "../../fxtr", editable = true }
behaviors = { path = "../../behaviors", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_rollouts"]

[tool.fxtr]
modules = ["behavior_rollouts.scripted_rollout", "behavior_rollouts.openai_rollout"]

[tool.fxtr.views]
package = "views"

[tool.pyright]
extends = "../../pyright-base.json"
include = ["src", "launch*.py", "tests"]
extraPaths = ["..", "../../fxtr/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "../../fxtr/tests"]
markers = ["llm_integration: calls live LLM providers; requires API keys and explicit opt-in"]
addopts = '-m "not llm_integration"'
