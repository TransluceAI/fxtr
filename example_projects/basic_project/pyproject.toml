[project]
name = "basic-project"
version = "0.1.0"
description = "A small fxtr project: the example experiments, launched the way a user launches theirs"
requires-python = ">=3.12.4"
dependencies = [
    "fxtr[runner,debug-web]",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[tool.uv]
package = true

[tool.uv.sources]
fxtr = { path = "../../fxtr", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_project"]

[tool.fxtr]
# The modules whose import registers this project's steps and workflows: what a process with no
# script of its own (a resume, the viewer) imports.
modules = [
    "basic_project.bio_refinement",
    "basic_project.rollout_experiment",
    "basic_project.model_harness_sweep",
    "basic_project.project_arrays",
    "basic_project.slow_mapped",
    "basic_project.huge_grid",
    "basic_project.array_queries",
]

[tool.fxtr.views]
# The project's renderer package (see views/): `fxtr views build` builds it into views/dist, which
# the viewer serves.
package = "views"

[tool.pyright]
extends = "../../pyright-base.json"
include = ["src", "launch_bio_refinement.py", "launch_model_harness_sweep.py", "launch_rollout_experiment.py", "launch_project_arrays.py", "launch_slow_mapped.py", "launch_huge_grid.py"]
