[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "py_testing"
version = "0.0.1"
description = "Python side of the fxtr nix-integration tests + throwaway entity types they exercise."
requires-python = ">=3.12"
dependencies = [
    "fxtr2",
    "fxtr_nix_writer",
    # The report-step builder fixture (report_fixture.py) imports build_root_report.
    # The TS CLI it shells out to is wired separately via the builder's `env`
    # (lib.fxtr.reportBuilderCli) — not a python dep.
    "fxtr_report_builder",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    # Pyeryx drives the guest-site-packages-check test: bind-mount the
    # _mkGuestSitePackages output into an eryx guest + run `import fxtr2`.
    # Dev-group only — mkVenv uses `workspace.deps.default`, so this
    # never enters the nix-built py_testing venv. Tests run from a
    # local `uv sync`'d virtualenv on the host.
    "pyeryx>=0.4.6",
    # The git-ref workdir test/scaffold helper (stdlib-only leaf package).
    # test_sandbox_import builds sandbox_smoke through it.
    "fxtr-workdir-harness",
]

# Relative path-deps resolve inside the store copy (flake at repo root).
# As in fxtr_nix_writer, fxtr2's non-PyPI sources are redeclared here
# because uv only honors the workspace root's `[tool.uv.sources]`.
[tool.uv.sources]
fxtr_nix_writer = { path = "../fxtr_nix_writer", editable = true }
fxtr-workdir-harness = { path = "../fxtr_workdir_harness", editable = true }
fxtr_report_builder = { path = "../../projects/fxtr_report_builder", editable = true }
fxtr2 = { path = "../../v2", editable = true }
fxtr = { path = "../../projects/fxtr_v1", editable = true }
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

[tool.uv.extra-build-dependencies]
cbrrr = ["setuptools"]
sqlitedict = ["setuptools"]
mashumaro = ["setuptools"]
fxtr = ["hatchling"]
fxtr2 = ["hatchling"]
fxtr_report_builder = ["hatchling"]
