# Helper for building throwaway workdir git repos from in-repo templates — the
# shared test/scaffold harness for the git-ref code path. Depends only on the
# stdlib + fxtr_nix_runner (the shared nix-runner backend it locks workdir
# flakes through, so a podman-backed run needs no host nix); intentionally no
# fxtr2 / heavy transitive deps, so any package can dev-dep it cheaply.
# See src/fxtr_workdir_harness/__init__.py + the stage3 plan's
# "Test & scaffold workdir setup".
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "fxtr-workdir-harness"
version = "0.0.0"
description = "Build throwaway workdir git repos from in-repo templates (test/scaffold helper)."
requires-python = ">=3.12"
dependencies = ["fxtr-nix-runner"]

[tool.uv.sources]
fxtr-nix-runner = { path = "../../projects/fxtr_nix_runner", editable = true }

[dependency-groups]
dev = ["pytest>=9.0.3"]
