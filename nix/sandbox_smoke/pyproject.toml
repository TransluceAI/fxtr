# Minimal uv workspace that lets `import fxtr2` work inside an eryx guest:
# the sandbox RPC adapter pulled with the `fxtr2-portable` extra (so the
# portable fxtr2 lands instead of the full host one). Built through
# `mkWasmService` as `fxtr.services.smoke` in this dir's `flake.nix`; the
# matching test (`py_testing/tests/test_sandbox_import.py`) builds it via
# `prepare_workdir_repo` and runs `import fxtr2` under eryx.
#
# **`[tool.uv.sources]` uses the comment-flip convention** (see
# `projects/fxtr_workstation/plans/phase0/part5_nix_workdir/stage3_bundle_and_spawner.md`
# "Test & scaffold workdir setup"):
#
#   - *Active (template) form* = relative editable path-deps, so `uv lock`
#     resolves against local working code (no stale/hardcoded rev). Only
#     valid *in place* at `nix/sandbox_smoke/`, where `../../` reaches the
#     repo packages.
#   - *Workdir form* (commented out, marked `active-in-workdir`) = a single
#     pinned git source. `prepare_workdir_repo` comments out the relative
#     lines and activates these in the copied workdir, then re-locks. The
#     git source is what builds: it gives uv the whole-repo context
#     `fxtr2-portable`'s `[tool.hatch...force-include]` (reaching
#     `../fxtr2/*`) needs, which a bare `path = ...` copy of one subdir
#     would not — and matches the shape real downstream agents see.
[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "fxtr_sandbox_smoke"
version = "0.0.1"
description = "Smallest workspace exercising _mkGuestSitePackages + eryx import end-to-end."
requires-python = ">=3.12"
dependencies = [
    "fxtr-sandbox-rpc-adapter[fxtr2-portable]",
]

# A single no-op `fxtr.service` entry point so `mkWasmService` can read an
# `entryPoint` off this workspace. The smoke test only builds
# `.sitePackages` + `import fxtr2`; `run` is never invoked.
[project.entry-points."fxtr.service"]
service = "fxtr_sandbox_smoke:run"

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-rpc-adapter = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter" } # fxtr-lib-sub: active-in-workdir
fxtr-sandbox-types = { path = "../../projects/fxtr_sandboxing/fxtr_sandbox_types", editable = true } # fxtr-lib-sub: active-in-template
# fxtr-sandbox-types = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "projects/fxtr_sandboxing/fxtr_sandbox_types" } # fxtr-lib-sub: active-in-workdir
fxtr2-portable = { path = "../../v2/portable", editable = true } # fxtr-lib-sub: active-in-template
# fxtr2-portable = { git = "@FXTR_LIB_URL@", rev = "@FXTR_LIB_REV@", subdirectory = "v2/portable" } # fxtr-lib-sub: active-in-workdir
mashumaro = { git = "https://github.com/danieldjohnson/mashumaro", branch = "push-ppqkwmlmmpnp" }

# Build-dep hints for sdists uv2nix builds in the nix sandbox (sdists that
# under-declare their build backend). Mirrors fxtr_nix_writer /
# py_testing.
[tool.uv.extra-build-dependencies]
cbrrr = ["setuptools"]
sqlitedict = ["setuptools"]
mashumaro = ["setuptools"]
fxtr-sandbox-rpc-adapter = ["hatchling"]
fxtr-sandbox-types = ["hatchling"]
fxtr2-portable = ["hatchling"]

[tool.uv]
# Constrain the resolver to WASI/wasm32 — the runtime target (eryx
# ships CPython 3.14 compiled to wasm32-wasip1). Both knobs are
# necessary:
#
#   - `environments` (the restrict-set) is the load-bearing knob.
#     uv only picks wheels valid for the listed envs, so packages
#     shipping platform-specific wheels (e.g. cbor2's
#     `cp312-x86_64-linux-gnu`) get pruned — only `py3-none-any` is
#     left as a candidate. This is what keeps `.so` files out of
#     the resulting venv.
#   - `required-environments` (the expand-set) asks uv to guarantee
#     a working lock for the named env, not just opportunistically.
#
# Why we can't drop `environments` and rely only on
# `required-environments` + a nix-side `environ` override: uv2nix
# delegates wheel selection to `pyproject-nix`'s `selectWheels`,
# which sorts compatible wheels by `bestLanguageTag` — so `cp312`
# (=312) beats `py3` (=3) when both are present. The lock's
# contents are the leverage point, not the marker eval. (Tag
# override would require either patching `pyproject-nix` or
# providing a wasi-tagged python interpreter, neither of which
# is practical right now.)
#
# Side effect: `uv sync` against this workspace from a non-wasi
# host will refuse — but this workspace is consumed by nix only,
# never installed locally, so that's fine. Chunk 4's agent
# workdir takes the same posture.
#
# https://docs.astral.sh/uv/reference/settings/#environments
# https://docs.astral.sh/uv/reference/settings/#required-environments
environments = ["sys_platform == 'wasi' and platform_machine == 'wasm32'"]
required-environments = ["sys_platform == 'wasi' and platform_machine == 'wasm32'"]
