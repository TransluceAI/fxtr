[project]
name = "mcp-sandbox-runtime"
version = "0.0.0"
description = "Bootstrap stub task for the mcp_plugin_spike SandboxFactory."
requires-python = ">=3.12"
# We never actually invoke this task's entry point — the MCP server
# uses _fxtr_mcp_runner.entry:run via direct_launcher with a
# volume-mounted package. This task exists only to give `prepare()`
# a valid pyproject whose dep closure
# (fxtr-sandbox-rpc-adapter[fxtr2-portable]) we use to assemble
# the long-lived eryx.SandboxFactory's site-packages.
dependencies = [
    "fxtr-sandbox-rpc-adapter[fxtr2-portable] @ https://fxtr.transluce.org/unreachable/fxtr_sandbox_rpc_adapter-0.0.0.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
fxtr-sandbox-rpc-adapter = { path = "../../../projects/fxtr_sandboxing/fxtr_sandbox_rpc_adapter" }

[project.entry-points."fxtr.service"]
# Placeholder — never actually called. See module docstring.
placeholder = "mcp_sandbox_runtime:placeholder"
