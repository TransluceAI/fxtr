[project]
name = "fxtr_workflow"
version = "0.1.0"
description = "Spike of a workflow management system for fxtr2"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "anyio>=4.12.1",
    "fxtr2",
    "h11>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/fxtr_workflow"]

[dependency-groups]
dev = [
    "gql[websockets]>=4.0.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["fxtr2", "fxtr_workflow"]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }
