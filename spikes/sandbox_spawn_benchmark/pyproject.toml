[project]
name = "sandbox_spawn_benchmark"
version = "0.1.0"
description = "Spike: benchmark + per-phase timing of nix-flake container sandbox spawns"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "fxtr2",
    "fxtr_nix_runner",
    "fxtr_sandboxing",
    "fxtr-sandbox-types[fxtr2]",
    "fxtr-workdir-harness",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_spawn_benchmark"]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }
fxtr_nix_runner = { path = "../../projects/fxtr_nix_runner", editable = true }
fxtr_sandboxing = { path = "../../projects/fxtr_sandboxing/fxtr_sandboxing", editable = true }
fxtr-sandbox-types = { path = "../../projects/fxtr_sandboxing/fxtr_sandbox_types", editable = true }
fxtr-workdir-harness = { path = "../../nix/fxtr_workdir_harness", editable = true }

[tool.pyright]
include = ["src/sandbox_spawn_benchmark"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = ["pyright>=1.1.0"]
