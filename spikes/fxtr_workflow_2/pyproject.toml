[project]
name = "fxtr_workflow_2"
version = "0.0.1a0"
description = "Partial prototype of a durable, trace-based task/workflow system on top of fxtr2 (not current — kept for reference)"
requires-python = ">=3.12"
dependencies = [
    "fxtr2",
    "anyio>=4.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fxtr_workflow_2"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-anyio>=0.0.0",
]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["fxtr2", "fxtr_workflow_2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
