[project]
name = "localpkg"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["typing-extensions>=4", "pydantic-core==2.47.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localpkg"]

[tool.hatch.build.targets.wheel.force-include]
"extra/borrowed_module.py" = "localpkg/borrowed_module.py"
