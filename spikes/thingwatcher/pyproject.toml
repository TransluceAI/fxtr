[project]
name = "thingwatcher"
version = "0.1.0"
description = "A tool for watching things - visualize state changes in objects over time"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "ariadne>=0.26.2",
    "cbor2>=5.8.0",
    "fxtr2",
    "hypercorn>=0.18.0",
    "sqlalchemy[aiosqlite]>=2.0.45",
    "starlette>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["thingwatcher"]

[dependency-groups]
dev = [
    "gql[websockets]>=4.0.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["fxtr2", "thingwatcher"]

[tool.uv.sources]
fxtr2 = { path = "../../v2", editable = true }
