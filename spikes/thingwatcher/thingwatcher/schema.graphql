# Custom scalar for arbitrary JSON objects (decoded CBOR data)
scalar JSON

# =============================================================================
# Query Root
# =============================================================================

type Query {
  # Primary entry points
  latestTick: Tick!
  tick(index: Int!): Tick

  # Timeline listing
  ticks(from: Int, to: Int, levels: [String!]): [Tick!]!

  # Direct thing lookup (for bookmarks, deep links)
  # Provide exactly one of: shortId, key, or keyJSON
  thing(shortId: Int, key: String, keyJSON: JSON, atTick: Int): Thing
  thingHistory(shortId: Int, key: String, keyJSON: JSON, from: Int, to: Int): [Thing!]!

  # Batch fetch things by keys. Returns array with null for keys that don't resolve.
  things(keys: [String!]!, atTick: Int!): [Thing]!

  # Single data chunk by ID (for caching/deduplication)
  # Supports "db:{id}" for snapshot chunks and "ext:{b64_key}" for store chunks.
  dataChunk(id: String!): DataChunk

  # Config
  renderingConfig: [ThingTypeConfig!]!
  thingTypeConfig(thingType: String!): ThingTypeConfig

  # Renderer modules (content-addressed by ID)
  rendererModule(id: String!): RendererModule

  # Trigger history (key or keyJSON to filter by thing)
  triggerRecords(key: String, keyJSON: JSON, from: Int, to: Int): [TriggerRecord!]!
  triggerRecord(id: Int!): TriggerRecord

  # Roots
  root(name: String!, atTick: Int): Root

  # Triggerable thing keys (b64-encoded)
  triggerableKeys: [String!]!
}

# =============================================================================
# Mutations
# =============================================================================

type Mutation {
  triggerTick(level: String = "info", desc: String = ""): Tick!
  # Provide exactly one of: shortId, key, or keyJSON
  triggerPause(shortId: Int, key: String, keyJSON: JSON, payload: JSON): TriggerResult!
  # Hard recapture - invalidate all state and take fresh snapshot
  hardRecapture: Tick!
}

# =============================================================================
# Subscriptions
# =============================================================================

type Subscription {
  # Subscribe to new ticks
  # includeStreamingUpdates: if true, also fires on streaming tick updates (default: false)
  newTick(includeStreamingUpdates: Boolean = false): NewTickPayload!
}

type NewTickPayload {
  tick: Tick!                      # The new or updated tick
  triggerableKeys: [String!]!      # Current triggerable thing keys (b64-encoded)
}

# =============================================================================
# Core Types
# =============================================================================

type Tick {
  index: Int!
  timestamp: Float!
  level: String!
  type: String!
  desc: JSON              # Tick description/message (renamed from 'data')

  # Nested things at this tick
  things(triggerable: Boolean): [Thing!]!

  # Changes since a previous tick
  changes(since: Int!): [ThingChange!]!

  # Named root entry points at this tick
  roots: [Root!]!
}

type Root {
  name: String!
  thing: Thing!           # The resolved thing at this tick (always exists)
}

type Thing {
  shortId: Int!
  key: String!            # Base64-encoded CBOR key (always available)
  keyJSON: JSON           # Decoded key as JSON, null if not JSON-compatible
  thingType: String!
  thingstateId: String!   # Stable identifier: "db:{id}" for snapshots, "ext:{key}" for stores
  links: [Link!]!
  backlinks: [Link!]!     # Links pointing TO this thing (reverse of links)

  # Data - nullable, lazily loaded only when requested
  dataChunks: [DataChunk!]

  # Convenience: first chunk's data (use dataChunks for full chain)
  data: JSON

  # Where this thing came from (can have multiple sources)
  # First source is the "winning" source that provides the resolved state.
  # Additional sources may be overridden (their state differs from resolved).
  sources: [ThingSource!]!
}

type Link {
  linkType: String!
  linkKey: String!        # Base64-encoded CBOR link key
  linkKeyJSON: JSON       # Decoded link key as JSON, null if not JSON-compatible
  fromThing: Thing!       # The source thing (for backlinks) - always exists
  toThing: Thing          # The target thing (for forward links) - null if not found
}

type DataChunk {
  id: String!             # Stable identifier: "db:{id}" for snapshots, "ext:{key}" for stores
  data: JSON
}

# =============================================================================
# Change Tracking
# =============================================================================

enum ChangeKind {
  ADDED
  MODIFIED
  REMOVED
}

type ThingChange {
  kind: ChangeKind!
  thing: Thing!           # For REMOVED: last known state before removal
}

# =============================================================================
# Thing Source Types (for immutable stores)
# =============================================================================

"""Where a thing's data came from."""
enum ThingSourceKind {
  SNAPSHOT    # Thing captured in a tick snapshot
  STORE       # Thing retrieved from an immutable store
}

"""Information about a source of a thing's data."""
type ThingSource {
  kind: ThingSourceKind!
  storeName: String       # Present when kind=STORE (name of the immutable store)
  overridden: Boolean!    # True if this source's state differs from the resolved state
}

# =============================================================================
# Trigger Types
# =============================================================================

type TriggerResult {
  ok: Boolean!
  triggerId: Int          # ID of the trigger record created
  error: String           # Error message if ok=false
}

type TriggerRecord {
  id: Int!
  thing: Thing!           # The thing that was triggered (state at trigger time)
  triggerTick: Int!
  payload: JSON           # Payload sent with the trigger
}

# =============================================================================
# Config Types
# =============================================================================

type ThingTypeConfig {
  thingType: String!
  color: String!
  linkColors: [LinkColorConfig!]!
  renderer: RendererReference  # Reference to renderer module + key, or null
}

type LinkColorConfig {
  linkType: String!
  color: String!
}

# =============================================================================
# Renderer Types
# =============================================================================

"""Reference from a thing type to a specific renderer within a module."""
type RendererReference {
  moduleId: String!         # Content-addressed module ID
  rendererKey: String!      # Key within the module's renderers map
}

"""A renderer module containing TSX source code."""
type RendererModule {
  id: String!               # Content-addressed module ID
  main: String!             # Main TSX source code
  imports: JSON!            # Map of import path -> source code
}
