<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Report</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; line-height: 1.6; }
      /* Shared elements morph over 300ms */
      ::view-transition-group(*) {
        animation-duration: 300ms;
        animation-timing-function: ease-in-out;
      }

      /* Breadcrumbs and sidebar: exclude from root, no animation */
      ::view-transition-group(breadcrumbs),
      ::view-transition-old(breadcrumbs),
      ::view-transition-new(breadcrumbs),
      ::view-transition-group(sidebar),
      ::view-transition-old(sidebar),
      ::view-transition-new(sidebar) {
        animation: none;
      }

      /* Root (non-shared main content): custom opacity-only keyframes.
         The group may morph size, but it's invisible because old fades out
         before new fades in — the size change happens while neither is visible. */
      @keyframes vt-fade-out {
        to { opacity: 0; }
      }
      @keyframes vt-fade-in {
        from { opacity: 0; }
      }
      ::view-transition-group(root) {
        animation-duration: 500ms;
      }
      ::view-transition-old(root) {
        animation-name: vt-fade-out;
        animation-duration: 150ms;
      }
      ::view-transition-new(root) {
        animation-name: vt-fade-in;
        animation-delay: 300ms;
        animation-duration: 200ms;
      }

      /* Respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation-duration: 0s !important;
          animation-delay: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
