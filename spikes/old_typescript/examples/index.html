<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Fxtr Entity Viewer</title>
	<style>
		body {
			font-family: system-ui, -apple-system, sans-serif;
			max-width: 800px;
			margin: 2rem auto;
			padding: 0 1rem;
			color: #1a1a1a;
			background: #fafafa;
		}
		h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
		h2 { font-size: 1.2rem; color: #555; }
		.pin-list { list-style: none; padding: 0; }
		.pin-list li { padding: 0.3rem 0; }
		.pin-list button {
			background: none;
			border: none;
			color: #0066cc;
			cursor: pointer;
			font-size: 0.95rem;
			padding: 0;
		}
		.pin-list button:hover { text-decoration: underline; }
		.controls { margin: 1rem 0; }
		.controls label { cursor: pointer; }
		.entity-view { margin-top: 1rem; padding: 1rem; background: white; border: 1px solid #ddd; border-radius: 4px; }
		.tag { display: inline-block; background: #e8e8e8; padding: 0.15rem 0.5rem; border-radius: 3px; margin-right: 0.3rem; font-size: 0.85rem; }
		.author { color: #666; }
		pre.cbor-tree { font-size: 0.85rem; line-height: 1.4; margin: 0; white-space: pre-wrap; }
		.cbor-key { color: #881280; }
		.cbor-string { color: #1a6b3e; }
		.cbor-number { color: #1750eb; }
		.cbor-bool { color: #c5060b; }
		.cbor-null { color: #999; }
		.cbor-bytes { color: #7b5804; }
		.cbor-toggle { cursor: pointer; user-select: none; background: none; border: none; padding: 0; margin: 0; font: inherit; color: inherit; display: inline; }
		.cbor-toggle:hover { text-decoration: underline; }
		.fxtr-badge {
			display: inline;
			background: #f0f0f0;
			border: 1px solid #ccc;
			border-radius: 3px;
			padding: 0 0.3rem;
			font: inherit;
			font-size: 0.8rem;
			cursor: pointer;
		}
		.fxtr-badge:hover { background: #e0e0e0; }
		.loading { color: #999; font-style: italic; }
	</style>
</head>
<body>
	<div id="root"></div>
	<script type="module" src="/src/web/main.tsx"></script>
</body>
</html>
