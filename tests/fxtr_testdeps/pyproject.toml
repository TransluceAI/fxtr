[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fxtr_testdeps"
version = "0.0.1"
description = "Test fixtures and dependencies for fxtr tests"
requires-python = "==3.12.*,!=3.12.5"
dependencies = [
    "fxtr",
]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.uv]
managed = false

[tool.uv.sources]
fxtr = { path = "../../", editable = true }
